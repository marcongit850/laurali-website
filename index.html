<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laurali Douglass</title>
    <meta name="description" content="Official website of Laurali Douglass.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f9;
            color: #24323a;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .content {
            max-width: 750px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 72px);
            margin: 0 0 18px;
            color: #173b4c;
            letter-spacing: -2px;
        }

        .tagline {
            font-size: 22px;
            color: #55717d;
            margin-bottom: 35px;
        }

        .line {
            width: 60px;
            height: 4px;
            background: #2c7b79;
            margin: 0 auto 35px;
            border-radius: 3px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #53636a;
        }

        .location {
            margin-top: 35px;
            font-size: 15px;
            color: #84939a;
        }
    </style>
</head>

<body>

<div class="hero">
    <div class="content">

        <h1>Laurali Douglass</h1>

        <div class="tagline">
            Student · Athlete
        </div>

        <div class="line"></div>

        <p>
            Welcome to the official website of Laurali Douglass.
        </p>

        <div class="location">
            Florida
        </div>

    </div>
</div>

</body>
</html>
